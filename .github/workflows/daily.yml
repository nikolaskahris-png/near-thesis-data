# Every day after 00:00 UTC: measure number 1 over the last 30 days,
# check it offline from the saved raw responses, and commit the result.
name: daily

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to measure, YYYY-MM-DD (empty = today in UTC)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (no network)
        run: python -m unittest discover -s tests
      - name: Measure
        env:
          DAY: ${{ inputs.date }}
        run: |
          if [ -n "$DAY" ]; then
            python scripts/daily.py --date "$DAY"
          else
            python scripts/daily.py
          fi
      - name: Offline check of every saved day
        run: python scripts/daily.py --verify
      - name: Show result on the run page
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cut -d, -f1,4,8,11,15,16,20 data/history.csv | tail -n 15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Validators' vote for the next protocol version (HSP-027 = v87)
        continue-on-error: true
        run: |
          python scripts/upgrade_watch.py
          python scripts/upgrade_watch.py --verify
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat data/upgrade_watch.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily data/raw data/history.csv
          git add data/upgrade_watch data/upgrade_watch.csv 2>/dev/null || true
          git commit -m "daily: $(tail -n 1 data/history.csv | cut -d, -f1)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push
